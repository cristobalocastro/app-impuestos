<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de impuestos</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c2430; --muted: #5b6675; --border: #dde2e8;
    --accent: #1f5fbf; --alta: #b42318; --alta-bg: #fdecea; --media: #9a6700; --media-bg: #fff4d6;
    --info: #1f5fbf; --info-bg: #e8f0fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2; --border: #2c3440;
      --accent: #6aa3ff; --alta: #ff8a80; --alta-bg: #3a1d1b; --media: #f2c14e; --media-bg: #3a3017;
      --info: #8ab4ff; --info-bg: #1b2a44;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  form { display: grid; gap: 12px; }
  label { font-weight: 600; font-size: .9rem; }
  input { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--border);
          border-radius: 8px; background: var(--bg); color: var(--text); }
  button { padding: 11px 16px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .nota { font-size: .85rem; color: var(--muted); margin: 0; }
  .error { color: var(--alta); font-weight: 600; margin: 0; }
  #resultado { margin-top: 24px; display: grid; gap: 16px; }
  .cabecera h2 { margin: 0; font-size: 1.2rem; }
  .cabecera p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .totales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .total { border-radius: 10px; padding: 12px; text-align: center; }
  .total b { display: block; font-size: 1.6rem; }
  .alta { background: var(--alta-bg); color: var(--alta); }
  .media { background: var(--media-bg); color: var(--media); }
  .info { background: var(--info-bg); color: var(--info); }
  .alerta { border-left: 4px solid; padding: 12px 16px; border-radius: 8px; background: var(--card);
            border-top: 1px solid var(--border); border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border); }
  .alerta.alta { border-left-color: var(--alta); }
  .alerta.media { border-left-color: var(--media); }
  .alerta.info { border-left-color: var(--info); }
  .alerta h3 { margin: 0 0 4px; font-size: 1rem; color: var(--text); }
  .alerta p { margin: 0; color: var(--muted); }
  .etiqueta { display: inline-block; font-size: .75rem; font-weight: 700; text-transform: uppercase;
              padding: 1px 8px; border-radius: 99px; margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>Revisión de impuestos</h1>
  <p class="sub">Ingresa tu RUT y clave del SII para revisar tu situación tributaria.</p>

  <div class="card">
    <form id="form" autocomplete="off">
      <div>
        <label for="rut">RUT</label>
        <input id="rut" name="rut" placeholder="12.345.678-5" required>
      </div>
      <div>
        <label for="clave">Clave tributaria</label>
        <input id="clave" name="clave" type="password" required>
      </div>
      <button id="enviar" type="submit">Revisar</button>
      <p class="nota">Tu clave no se guarda: se usa solo para esta revisión. Modo de prueba: RUT 11.111.111-1, clave <code>demo</code>.</p>
      <p class="error" id="error" hidden></p>
    </form>
  </div>

  <section id="resultado" hidden></section>
</main>
<script>
const form = document.getElementById("form");
const boton = document.getElementById("enviar");
const error = document.getElementById("error");
const resultado = document.getElementById("resultado");
const NOMBRES = { alta: "Urgente", media: "Atención", info: "Informativo" };

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  error.hidden = true;
  boton.disabled = true;
  boton.textContent = "Revisando...";
  const clave = document.getElementById("clave");
  try {
    const resp = await fetch("/api/revision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rut: document.getElementById("rut").value, clave: clave.value }),
    });
    const datos = await resp.json();
    if (!resp.ok) throw new Error(datos.detail || "No se pudo hacer la revisión.");
    mostrar(datos);
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
  } finally {
    clave.value = "";
    boton.disabled = false;
    boton.textContent = "Revisar";
  }
});

function mostrar(r) {
  const c = r.contribuyente;
  const alertas = r.alertas.map(a => `
    <div class="alerta ${a.severidad}">
      <span class="etiqueta ${a.severidad}">${NOMBRES[a.severidad]}</span>
      <h3>${esc(a.titulo)}</h3>
      <p>${esc(a.detalle)}</p>
    </div>`).join("");
  resultado.innerHTML = `
    <div class="card cabecera">
      <h2>${esc(c.nombre)}</h2>
      <p>RUT ${esc(c.rut)} · ${esc(c.actividades.join(", "))}</p>
      <p>Revisado el ${esc(r.fecha_revision)}${r.fuente === "simulado" ? " · datos de prueba" : ""}</p>
    </div>
    <div class="totales">
      <div class="total alta"><b>${r.resumen.alta}</b>Urgentes</div>
      <div class="total media"><b>${r.resumen.media}</b>Atención</div>
      <div class="total info"><b>${r.resumen.info}</b>Informativas</div>
    </div>
    ${alertas || '<div class="card">Todo en orden, no encontramos problemas.</div>'}`;
  resultado.hidden = false;
}
</script>
</body>
</html>
